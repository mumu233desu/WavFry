# ==============================================================================
# WavFry Backbone Comparison Ablation: wav2vec 2.0 Baseline
# Frozen wav2vec 2.0-Base Backbone | Multi-Task [Creaky, Breathy] | Block Paradigm
# Weak-Off Baseline (Pure Strong Supervision) + QUT-NOISE Real Noise & RIR
# ==============================================================================

# ── 数据 ──────────────────────────────────────────────
data:
  isolate_split_speakers: true
  num_workers: auto
  pin_memory: true
  prefetch_factor: 2

# ── 模型 ──────────────────────────────────────────────
model:
  backbone: facebook/wav2vec2-base
  fine_tune_layers: "none"
  use_scalar_mix: true
  dropout: 0.1
  head_hidden_dim: 256
  use_positional_encoding: false
  pos_embed_dim: 32
  tasks: [creaky, breathy]

# ── 训练 ──────────────────────────────────────────────
training:
  quiet: true
  optimizer: adamw_fp32
  epochs: 20
  gradient_accumulation_steps: 1
  backbone_lr: 0.0
  head_lr: 1.0e-4
  warmup_steps: 200
  weight_decay: 0.01
  grad_clip: 1.0
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  seed: 42
  mixed_precision: bf16
  gradient_checkpointing: false
  lr_schedule: cosine
  min_lr_ratio: 0.05
  paradigm: block

  segment:
    batch_size: 32
    context_padding_ms: 30
    continuous_non_creaky_sampling:
      enabled: false

  block:
    batch_size: 64
    val_batch_size: 128
    duration_ms: 2000
    hop_ms: 1000
    max_intervals: 12
    boundary_trim_frames: 0
    frame_head:
      enabled: true
      loss_weight: 0.1
      mil_mode: linear_softmax
      temperature: 1.0
      topk_ratio: 0.2
      interval_from_frame:
        enabled: false
        mode: linear_softmax
        temperature: 1.0
        topk_ratio: 0.2

  weak_supervision:
    enabled: true
    manifest: manifests/weak_breathy.csv
    task: breathy
    candidate_scope: vowels
    loss_weight: 0.3
    start_epoch: 4
    samples_per_epoch: 447
    max_windows: 64

  # ── VSDC-Net 弱监督时序定位增强配置 ───────────────────────
  vsdc:
    enabled: true
    mil_pooling: linear_softmax

    bas_net:
      enabled: true
      hidden_dim: 256
      loss_weight_base: 0.1
      loss_weight_supp: 0.1
      loss_weight_supp_zero: 0.1
      loss_weight_sparse: 0.005
      loss_weight_head_align: 0.1

    speaker_contrast:
      enabled: true
      temperature: 0.07
      topk_anchors: 2
      proj_dim: 128
      loss_weight: 0.2

    mean_teacher:
      enabled: true
      ema_decay: 0.98
      median_window: 3
      temp_sharp: 0.5
      conf_margin: 0.35
      loss_weight: 1.0

    curriculum:
      enabled: true
      stage_epochs: [3, 7]

  pooling_mode: attn
  topk_ratio: 0.2
  topk_min_frames: 3

# ── 评估 ──────────────────────────────────────────────
eval:
  primary_task: creaky
  primary_metric: auc_pr
  early_stopping_patience: 5
  eval_interval: 1

# ── TensorBoard ───────────────────────────────────────
tensorboard:
  log_dir: exp_results/runs/ablation_backbone_wav2vec2
  log_audio_samples: true
  audio_sample_count: 4
  log_confusion_matrix: true
  log_pr_curve: true

# ── Checkpoint ────────────────────────────────────────
checkpoint:
  dir: exp_results/checkpoints/ablation_backbone_wav2vec2
  save_mode: delta
  keep_best_count: 3

# ── 数据增强（训练专用，推理不使用）────────────────────
augmentation:
  enabled: true
  aug_order: noise_first
  schedule_power: 2.0

  reverb:
    enabled: true
    prob: 0.3
    curriculum: true
    max_epochs: 20
    schedule_power: 2.0
    rir_dir: E:/Corpus/Noise/QUT-NOISE_processed/impulses
    scenarios: [car, reverb]

  noise:
    enabled: true
    prob: 0.5
    sources:
      pink: 0.3
      real_world: 0.7
    real_world_dir: E:/Corpus/Noise/QUT-NOISE_processed/noise
    scenarios: [cafe, car, home, reverb, street]
    pink_low_cutoff_hz: 10.0
    snr_db_start: 30.0
    snr_db_end: 10.0

  denoising:
    enabled: true
    prob: 0.5
    atten_lim_db_start: 0.0
    atten_lim_db_end: 15.0
