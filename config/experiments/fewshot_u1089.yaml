# Few-shot Speaker Adaptation Experiment Configuration (Speaker: U1089)
# Comparing Model A (Zero-shot), Model B (Joint 1x), Model C (Joint 5x), Model D (TTA Head)

experiment:
  name: fewshot_adaptation_u1089
  target_speaker: U1089
  output_dir: exp_results/experiments/fewshot_u1089
  seed: 42
  shots:
    positive_file_key: M_22_Sichuan_EN_ZH-CN_U1089_S0_269   # 21 segments, 8 creaky
    negative_file_key: M_22_Sichuan_EN_ZH-CN_U1089_S0_285   # 15 segments, 0 creaky
  oversample_factor: 5  # For Model C
  tta:                  # For Model D (Test-Time Adaptation)
    steps: 15
    lr: 1.0e-4
    freeze_backbone: true
    freeze_scalar_mix: true
    batch_size: 8
  knn:                  # For Model E (Dual-Prototype Contrastive KNN)
    alpha_min: 0.0
    alpha_max: 10.0
    alpha_steps: 21     # step = 0.5
  platt:                # For Model F (Logit-level Platt Calibration)
    reg_lambda: 0.1
  lora:                 # For Model G (Head-embedded LoRA)
    rank: 1
    alpha: 1.0
    steps: 20
    lr: 1.0e-3
    weight_decay: 0.01

data:
  manifest_path: manifests/segments_multi.csv
  num_workers: auto
  pin_memory: true

model:
  backbone: microsoft/wavlm-base-plus
  fine_tune_layers: "4-8"
  use_scalar_mix: true
  dropout: 0.1
  head_hidden_dim: 256
  pooling_mode: mean

training:
  epochs: 20
  gradient_accumulation_steps: 2
  backbone_lr: 1.0e-5
  head_lr: 1.0e-4
  warmup_steps: 100
  weight_decay: 0.01
  grad_clip: 1.0
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  mixed_precision: bf16    # Native hardware acceleration on RTX 4060 Ti
  quiet: true              # Silence per-batch tqdm spam in non-interactive environment
  seed: 42
  paradigm: segment
  segment:
    batch_size: 16
    context_padding_ms: 30
  pooling_mode: mean

tensorboard:
  log_dir: exp_results/experiments/fewshot_u1089/runs
  log_audio_samples: false
  log_confusion_matrix: false
  log_pr_curve: false

eval:
  primary_task: creaky        # 主任务：决定 pos_weight 口径（已按任务解耦）、顶层指标与早停仲裁
  primary_metric: auc_pr
  early_stopping_patience: 3

checkpoint:
  dir: exp_results/experiments/fewshot_u1089/checkpoints
  save_mode: delta
  keep_best_count: 1
