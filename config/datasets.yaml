# ==============================================================================
# WavFry 多数据集注册表 (datasets.yaml)
# 每个 entry 声明一个数据集的物理路径、标注格式、任务标签和划分策略
# ==============================================================================

datasets:

  # ── CS-Dialogue（核心数据集，creaky 精标，MFA TextGrid + sampling_state） ──
  - dataset_id: cs_dialogue
    enabled: true
    display_name: "CS-Dialogue (Creaky)"
    domain: conversational_efl      # 领域标签，供分析用

    # 标注适配器：统一使用 sharded_textgrid_cache
    annotation_adapter: sharded_textgrid_cache
    adapter_params:
      audio_dir: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/01_en_dereverb
      textgrid_dir: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/02_en_mfa_aligned
      cache_dir: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/02_en_mfa_aligned/_creaky_cache
      language: en
      phone_tier_name: phones
      min_duration_ms: 30

    # 任务标签声明：此数据集提供哪些任务的标签
    label_schema:
      creaky: true    # 提供 creaky 精标
      breathy:
        enabled: false             # 不提供元音气声精标（元音标签保持 NaN）
        silence_as_negative: false # 关闭静音(SP)负样本填充

    # 划分策略
    split_strategy: batch_split   # 使用 batch_split 列（来自 sampling_state.json）
    # split_strategy 可选值:
    #   batch_split  - 由 sampling_state.json 中 batch.split 字段决定
    #   speaker_list - 指定 val_speakers 列表
    #   all_train    - 全部作为训练集（外部数据集常用）
    #   random       - 随机按比例划分（seed 由全局 training.seed 控制）

  # ── MELI Mandarin（普通话朗读与自发语音，TextGrid + _creaky_cache，creaky 精标） ──
  - dataset_id: meli_mandarin
    enabled: true
    display_name: "MELI Mandarin (Creaky)"
    domain: spontaneous_mandarin

    annotation_adapter: sharded_textgrid_cache
    adapter_params:
      audio_dir: E:/Corpus/Creaky/MELI_processed/audio
      textgrid_dir: E:/Corpus/Creaky/MELI_processed/textgrid
      cache_dir: E:/Corpus/Creaky/MELI_processed/textgrid/_creaky_cache
      manifest_csv: E:/Corpus/Creaky/MELI_processed/manifest_slices.csv
      language: zh
      phone_tier_name: phones
      min_duration_ms: 30

    label_schema:
      creaky: true
      breathy:
        enabled: false
        silence_as_negative: false

    split_strategy: batch_split

