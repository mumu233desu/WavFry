# ==============================================================================
# WavFry 多数据集注册表 (datasets.yaml)
# 每个 entry 声明一个数据集的物理路径、标注格式、任务标签和划分策略
# ==============================================================================

datasets:

  # ── CS-Dialogue（核心数据集，creaky 精标，MFA TextGrid + sampling_state） ──
  - dataset_id: cs_dialogue
    enabled: true
    display_name: "CS-Dialogue (Creaky)"
    domain: conversational_efl      # 领域标签，供分析用

    # 标注适配器：指定如何读取此数据集的标注
    annotation_adapter: cs_dialogue_textgrid
    # adapter 专属参数
    adapter_params:
      annotated_speakers: [U1001, U0046, U2013, U1089, U2002, U2004, U1067, U0037]
      audio_dirs:
        en: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/01_en_dereverb
        zh: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/11_zh_dereverb
      textgrid_dirs:
        en: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/02_en_mfa_aligned
        zh: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/12_zh_hfa_aligned
      phone_tier_name: phones
      creaky_tier_name: creaky
      min_duration_ms: 30
      include_languages: [en]
      training_phone_types: [vowel, voiceless_obs, silence, sonorant]

    # 任务标签声明：此数据集提供哪些任务的标签
    label_schema:
      creaky: true    # 提供 creaky 精标
      breathy:
        enabled: false             # 不提供元音气声精标（元音标签保持 NaN）
        silence_as_negative: true  # 显式声明：将静音(SP)作为确定性负样本（标签赋予 0.0）

    # 划分策略
    split_strategy: batch_split   # 使用 batch_split 列（来自 sampling_state.json）
    # split_strategy 可选值:
    #   batch_split  - 由 sampling_state.json 中 batch.split 字段决定
    #   speaker_list - 指定 val_speakers 列表
    #   all_train    - 全部作为训练集（外部数据集常用）
    #   random       - 随机按比例划分（seed 由全局 training.seed 控制）

  # ── UCLA Mazatec（马萨特克语：breathy 学习，creaky 关闭） ──
  - dataset_id: ucla_mazatec
    enabled: true
    display_name: "UCLA Mazatec (Breathy)"
    domain: phonetic_controlled

    annotation_adapter: breathy_cache
    adapter_params:
      audio_dir: E:/Corpus/Breathy/UCLA/Mazatec/Mazatec_Audio
      cache_dir: E:/Corpus/Breathy/UCLA/Mazatec/Mazatec_Audio/_breathy_cache
      textgrid_dir: E:/Corpus/Breathy/UCLA/Mazatec/Mazatec_TextGrids
      language: maj
      annotation_granularity: segment
      min_duration_ms: 30

    label_schema:
      creaky: false
      breathy: true

    split_strategy: random   # 按说话人随机划分 80/10/10

  # ── UCLA Gujarati（古吉拉特语：元音 modal vs breathy 最小对立，由 _breathy_cache 提供） ──
  - dataset_id: ucla_gujarati
    enabled: true
    display_name: "UCLA Gujarati (Breathy/Modal)"
    domain: phonetic_controlled

    annotation_adapter: breathy_cache
    adapter_params:
      audio_dir: E:/Corpus/Breathy/UCLA/Gujarati/Gujarati_Audio
      cache_dir: E:/Corpus/Breathy/UCLA/Gujarati/Gujarati_Audio/_breathy_cache
      textgrid_dir: E:/Corpus/Breathy/UCLA/Gujarati/Gujarati_TextGrids
      language: guj
      annotation_granularity: segment
      min_duration_ms: 30

    label_schema:
      creaky: false   # Gujarati 不提供 creaky 标签，此列填 NaN
      breathy: true   # 提供 breathy 标签

    split_strategy: random   # 按说话人随机划分 80/10/10

  # ── UCLA Zapotec（萨波特克语：breathy 学习，creaky 关闭） ──
  - dataset_id: ucla_zapotec
    enabled: true
    display_name: "UCLA Zapotec (Breathy)"
    domain: phonetic_controlled

    annotation_adapter: breathy_cache
    adapter_params:
      audio_dir: E:/Corpus/Breathy/UCLA/Zapotec/Zapotec_Audio
      cache_dir: E:/Corpus/Breathy/UCLA/Zapotec/Zapotec_Audio/_breathy_cache
      textgrid_dir: E:/Corpus/Breathy/UCLA/Zapotec/Zapotec_TextGrids
      language: zap
      annotation_granularity: segment
      min_duration_ms: 30

    label_schema:
      creaky: false
      breathy: true

    split_strategy: random   # 按说话人随机划分 80/10/10

  # ── UCLA Hmong（白苗语：breathy 学习，creaky 关闭） ──
  - dataset_id: ucla_hmong
    enabled: true
    display_name: "UCLA Hmong (Breathy)"
    domain: phonetic_controlled

    annotation_adapter: breathy_cache
    adapter_params:
      audio_dir: E:/Corpus/Breathy/UCLA/Hmong/Hmong_Audio
      cache_dir: E:/Corpus/Breathy/UCLA/Hmong/Hmong_Audio/_breathy_cache
      textgrid_dir: E:/Corpus/Breathy/UCLA/Hmong/Hmong_TextGrids
      language: hmn
      annotation_granularity: segment
      min_duration_ms: 30

    label_schema:
      creaky: false
      breathy: true

    split_strategy: random   # 按说话人随机划分 80/10/10

  # ── UCLA Miao（黑苗语/黔东方言：breathy 学习，creaky 关闭） ──
  - dataset_id: ucla_miao
    enabled: true
    display_name: "UCLA Black Miao (Breathy)"
    domain: phonetic_controlled

    annotation_adapter: breathy_cache
    adapter_params:
      audio_dir: E:/Corpus/Breathy/UCLA/Miao/Miao_Audio
      cache_dir: E:/Corpus/Breathy/UCLA/Miao/Miao_Audio/_breathy_cache
      textgrid_dir: E:/Corpus/Breathy/UCLA/Miao/Miao_Textgrids
      language: hea
      annotation_granularity: segment
      min_duration_ms: 30

    label_schema:
      creaky: false
      breathy: true

    split_strategy: random   # 按说话人随机划分 80/10/10


# ==============================================================================
# 全局 Manifest 构建参数
# ==============================================================================
manifest:
  output_dir: manifests/
  output_filename: segments_multi.csv
  save_per_dataset: true   # 每个 dataset_id 单独保存一份，便于调试

# ==============================================================================
# 全局划分兜底参数（当 split_strategy=random 时使用）
# ==============================================================================
split_defaults:
  seed: 42
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
