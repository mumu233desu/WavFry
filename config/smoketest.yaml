# WavFry Smoketest Configuration (smoketest.yaml)
# Inherits from _defaults.yaml (manually here for simplicity in the test)

data:
  annotated_speakers: [U0046, U1001, U2013, U1089, U2002, U2004, U0055]
  isolate_split_speakers: true
  audio_formats: [wav, flac]
  num_workers: 0
  pin_memory: false

model:
  backbone: microsoft/wavlm-base-plus
  fine_tune_layers: "4-8" # Only fine-tune last layer for speed (No, I changed this manually. Don't do this.)
  use_scalar_mix: true
  dropout: 0.1
  head_hidden_dim: 64

training:
  optimizer: adamw_fp32
  epochs: 1
  gradient_accumulation_steps: 1
  backbone_lr: 1.0e-5
  head_lr: 1.0e-4
  warmup_steps: 1           # smoketest 中 total_steps 极小，需缩小 warmup
  lr_schedule: cosine_restart
  min_lr_ratio: 0.05
  restart_aug_threshold: 0.11
  restart_lr_ratio: 0.45
  restart_warmup_steps: 1
  grad_clip: 1.0
  loss: focal
  seed: 42
  mixed_precision: no # Disable for smoketest safety
  gradient_checkpointing: false
  ablation:
    use_cosine_restart: false
    use_positional_encoding: true
    pos_embed_dim: 32
  # ── 训练范式主开关 ──────────────────────────────────────
  paradigm: segment

  # ── Segment 范式专属参数 ──────────────────────────────
  segment:
    batch_size: 32
    context_padding_ms: 50
    continuous_non_creaky_sampling:
      enabled: true
      extra_sample_ratio: 0.08
      min_duration_ms: 150
      target_duration_ms: 300
      max_duration_ms: 350
      min_intervals: 1
      max_intervals: 4
      max_sp_duration_ms: 200
      max_sp_ratio: 0.35
      allow_sp_only: false

  # ── Block 范式专属参数 ────────────────────────────────
  block:
    batch_size: 2
    duration_ms: 2000
    hop_ms: 1000
    max_intervals: 8
    boundary_trim_frames: 0
    frame_head:
      enabled: false
      loss_weight: 0.1
      mil_mode: lse
      temperature: 1.0
      topk_ratio: 0.2
  pooling_mode: mean_attn
  topk_ratio: 0.2
  topk_min_frames: 3

eval:
  primary_metric: auc_pr
  early_stopping_patience: 0

tensorboard:
  log_dir: R:/runs/smoketest
  log_audio_samples: true
  log_confusion_matrix: false
  log_pr_curve: false

checkpoint:
  dir: R:/checkpoints/smoketest
  save_mode: delta
  keep_best_count: 1

augmentation:
  enabled: true
  aug_order: noise_first
  schedule_power: 2.0
  denoising:
    enabled: true
    prob: 0.5
    atten_lim_db_start: 0.0
    atten_lim_db_end: 15.0
  noise:
    enabled: true
    prob: 0.5
    type: white
    pink_low_cutoff_hz: 10.0
    snr_db_start: 40.0
    snr_db_end: 20.0
