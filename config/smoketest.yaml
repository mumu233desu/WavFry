# WavFry Smoketest Configuration (smoketest.yaml)
# Inherits from _defaults.yaml (manually here for simplicity in the test)

data:
  annotated_speakers: [U1001, U0046, U2013, U1089, U2002, U2004, U0055]
  audio_dirs:
    en: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/01_en_dereverb
    zh: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/11_zh_dereverb
  textgrid_dirs:
    en: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/02_en_mfa_aligned
    zh: E:/Corpus/CS-Dialogue/data/short_wav/WAVE/12_zh_hfa_aligned
  phone_tier_name: phones
  creaky_tier_name: creaky
  context_padding_ms: 50
  min_duration_ms: 40
  val_speakers: [U2002]
  audio_formats: [wav, flac]
  num_workers: 0
  pin_memory: false

model:
  backbone: microsoft/wavlm-base-plus
  fine_tune_layers: "4-8" # Only fine-tune last layer for speed (No, I changed this manually. Don't do this.)
  use_scalar_mix: true
  dropout: 0.1
  head_hidden_dim: 64

training:
  epochs: 1
  batch_size: 32
  gradient_accumulation_steps: 1
  backbone_lr: 1.0e-5
  head_lr: 1.0e-4
  warmup_steps: 5           # smoketest 中 total_steps 极小，需缩小 warmup
  lr_schedule: cosine
  min_lr_ratio: 0.0         # smoketest 无需 eta_min
  grad_clip: 1.0
  loss: focal
  seed: 42
  mixed_precision: no # Disable for smoketest safety
  gradient_checkpointing: false

eval:
  primary_metric: f1
  early_stopping_patience: 1

tensorboard:
  log_dir: runs/smoketest
  log_audio_samples: true
  log_confusion_matrix: false
  log_pr_curve: false

checkpoint:
  dir: R:/checkpoints/smoketest
  save_mode: delta
