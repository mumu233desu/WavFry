# WavFry Default Configuration (_defaults.yaml)

# ── 数据 ──────────────────────────────────────────────
data:
  annotated_speakers: [U1001, U0046, U2013, U1089, U2002, U2004, U1067, U0037]
  isolate_split_speakers: true
  audio_formats: [wav, flac]
  num_workers: auto
  pin_memory: true
  prefetch_factor: 2

# ── 模型 ──────────────────────────────────────────────
model:
  backbone: microsoft/wavlm-base-plus  # 可换 wavlm-base / wavlm-large
  # 选择性微调层："4-8" | [4,5,6,7,8] | "all" | "none"
  # 推荐中偏下层 4-8（音素/发音方式特征区间）
  fine_tune_layers: "4-8"
  use_scalar_mix: true               # 所有层学习加权聚合
  dropout: 0.1
  head_hidden_dim: 256               # 分类头隐层（自动适配 backbone 输出维度）

# ── 训练 ──────────────────────────────────────────────
training:
  epochs: 20
  gradient_accumulation_steps: 1     # 有效 batch = batch_size × accumulation
                                     # 显存不足时设 2/4，等效扩大 batch
  backbone_lr: 1.0e-5                # 微调层 LR（远小于 head）
  head_lr: 1.0e-4                    # 分类头 + scalar mix LR
  warmup_steps: 200
  weight_decay: 0.01                 # 仅应用于分类头权重层
  grad_clip: 1.0
  loss: focal                        # focal | weighted_bce
  focal_gamma: 2.0
  focal_alpha: 0.75
  seed: 42
  # 混合精度：fp16（RTX）/ bf16（A100/Colab TPU）/ no
  mixed_precision: fp16
  # 梯度检查点：显著降低显存，轻微降低速度，Colab/8GB 显存建议开启
  gradient_checkpointing: false
  # ── 学习率调度 ──────────────────────────────────────
  lr_schedule: cosine       # cosine（推荐）| linear | none（仅预热，保持当前行为）
  min_lr_ratio: 0.05        # 余弦退火终点 = base_lr × min_lr_ratio，防止衰减到 0
  paradigm: segment
  segment:
    batch_size: 64
    context_padding_ms: 30
  # ── 池化策略 ────────────────────────────────────────
  pooling_mode: mean_attn    # mean | mean_topk (L2-proxy) | mean_attn (learnable)
  topk_ratio: 0.2           # Top-K 取帧比例
  topk_min_frames: 3        # Top-K 最少取几帧

# ── 评估 ──────────────────────────────────────────────
eval:
  primary_metric: auc_pr        # auc_pr（推荐）| f1 — 决定 early-stopping 和最优 ckpt 判断依据
  early_stopping_patience: 4  # 设为 0 以禁用，确保跑完完整的余弦退火曲线

# ── TensorBoard ───────────────────────────────────────
tensorboard:
  log_dir: runs/
  log_audio_samples: true
  audio_sample_count: 8
  log_confusion_matrix: true
  log_pr_curve: true

# ── Checkpoint ────────────────────────────────────────
checkpoint:
  dir: R:/checkpoints/
  save_mode: delta                   # delta（只存微调权重）| full（完整模型）
  keep_best_count: 2                 # 每个 speaker 只保留指标最好的 N 个 ckpt

# ── 推理 ──────────────────────────────────────────────
inference:
  threshold: 0.5
  output_confidence: true

# ── 预处理（训练+验证+推理均应用）──────────────────────
preprocessing:
  lowpass:
    enabled: false          # 总开关
    cutoff_hz: 3000.0       # 截止频率（Hz）；等效于 6dB/oct @ 2kHz 的视觉效果
    Q: 0.707                # Butterworth Q 值（0.707 = 最平坦通带）

# ── 数据增强（训练专用，推理不使用）────────────────────
augmentation:
  enabled: true              # 总开关：false = 完全不做增强（baseline 对照组）

  # 增强顺序（denoising 和 noise 同时触发时）
  aug_order: noise_first      # noise_first（默认）| denoise_first | random
  # 课程调度曲线幂次：1.0=线性，2.0=慢起步（默认），3.0=更保守
  schedule_power: 2.0

  denoising:
    enabled: true             # 降噪增强开关
    prob: 0.5                 # 每个样本应用降噪的概率
    # 降噪强度随 epoch 按幂次曲线增大（atten_lim_db 单位：dB）
    # atten_lim_db 越大 = 降噪越激进
    atten_lim_db_start: 0.0   # epoch 1 时的强度（不降噪）
    atten_lim_db_end: 15.0    # 最终 epoch 时的强度（适中）

  noise:
    enabled: true             # 加噪增强开关
    prob: 0.5                 # 每个样本应用加噪的概率
    # SNR 随 epoch 按幂次曲线下降（SNR 越低 = 噪声越多）
    snr_db_start: 40.0        # epoch 1 时（几乎听不出噪声）
    snr_db_end: 20.0          # 最终 epoch 时（明显但不严重）
